<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Dusk Highway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D view; instruments pinned to the corners like a dashboard, one centred card for start / pause / crash. */
:root{
  color-scheme: dark;
  --asphalt:#17161f;
  --ink:#fff3e2;
  --ink-dim:#d9c4b4;
  --amber:#ffb347;
  --tail:#ff4334;
  --panel:rgba(23,20,32,.62);
  --panel-solid:#211d2c;
  --line:rgba(255,243,226,.22);
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(12px + env(safe-area-inset-top, 0px));
  --gb:calc(16px + env(safe-area-inset-bottom, 0px));
}
html,body{height:100%}
body{background:var(--asphalt);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:var(--gt) var(--gb)}
.hud > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top > *{pointer-events:auto}
.speed{display:flex;align-items:baseline;gap:6px;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.speed b{font:800 64px/0.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:2.1ch;text-align:right}
.speed span{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0;flex:1 1 0}
.odo{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.06em;
  background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:4px}
.odo small{font-size:12px;letter-spacing:.14em;color:var(--ink-dim);margin-left:4px}
.score{font:700 15px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.score b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.speed b{font-size:52px}.chip{padding:8px 10px}}
.chip{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:36px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);font:800 26px var(--display);letter-spacing:.08em;
  text-transform:uppercase;color:var(--amber);text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding-left:var(--gl);padding-right:var(--gr);padding-bottom:var(--gb);pointer-events:none}
.wheel{width:132px;height:132px;border-radius:50%;border:13px solid rgba(255,243,226,.85);background:rgba(23,20,32,.28);
  position:relative;touch-action:none;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:grab}
.wheel::before{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:12px;margin-top:-2px;background:rgba(255,243,226,.85);border-radius:3px}
.wheel::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:52%;margin-left:-6px;background:rgba(255,243,226,.85);border-radius:3px}
.wheel i{position:absolute;left:50%;top:-13px;width:10px;height:13px;margin-left:-5px;background:var(--amber);border-radius:2px}
.pedals{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.pedal{touch-action:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
  font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer;
  background-image:repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,243,226,.12) 9px 11px)}
.pedal.brake{width:84px;height:78px}
.pedal.gas{width:70px;height:128px}
.pedal.down{transform:translateY(3px) scale(.97);border-color:var(--amber);color:var(--amber)}
.pedal.brake.down{border-color:var(--tail);color:var(--tail)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:var(--gt) var(--gb);
  background:linear-gradient(180deg,rgba(23,20,32,.25),rgba(23,20,32,.7));overflow:auto}
.card{width:min(100%,420px);background:var(--panel-solid);border:1px solid var(--line);border-top:4px solid var(--amber);
  border-radius:6px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:0;font:800 44px/0.95 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-dim)}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
.how li{display:flex;gap:10px}
.how b{flex:0 0 68px;font:700 14px/1.5 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.stats b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.btn{font:800 20px var(--display);letter-spacing:.1em;text-transform:uppercase;color:#1b1420;background:var(--amber);border:0;border-radius:4px;
  padding:14px 18px;min-height:52px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.note{font-size:13px;color:var(--ink-dim)}
@media (max-height:430px){
  .speed b{font-size:46px}
  .wheel{width:108px;height:108px;border-width:11px}
  .pedal.gas{height:100px}.pedal.brake{height:64px}
  .card{padding:14px 18px;gap:8px}.card h1{font-size:30px}
  .how{gap:3px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="3D highway view"></canvas>

<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="speed"><b id="spd">0</b><span>km/h</span></div>
    <div class="right">
      <div class="odo"><span id="odo">000.00</span><small>KM</small></div>
      <div class="score">Score<b id="score">0</b></div>
      <div class="chips">
        <button class="chip" id="modeBtn" type="button" aria-pressed="false">Touch</button>
        <button class="chip" id="soundBtn" type="button" aria-pressed="true">Sound</button>
        <button class="chip" id="pauseBtn" type="button">Pause</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="controls" id="controls" hidden>
  <div class="wheel" id="wheel" role="slider" aria-label="Steering wheel" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><i></i></div>
  <div class="pedals">
    <button class="pedal brake" id="brake" type="button">Brake</button>
    <button class="pedal gas" id="gas" type="button">Gas</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var card = $('card'), overlay = $('overlay');
if (!window.THREE) {
  card.innerHTML = '<h1>Could not load</h1><p>The 3D engine did not download. Check your connection and reload the page.</p>';
  return;
}
var rand = Math.random, clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
var store = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
              set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ---------- renderer & scene ---------- */
var canvas = $('view'), renderer;
try { renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){ card.innerHTML = '<h1>No 3D support</h1><p>This browser could not start WebGL. Try Chrome or Safari on your phone.</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
var scene = new THREE.Scene();
var HAZE = 0xf2a565;
scene.fog = new THREE.Fog(HAZE, 70, 400);
function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
(function sky(){
  var c = mkCanvas(4,512), g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#141838'); gr.addColorStop(.22,'#3b2f68'); gr.addColorStop(.36,'#a2536c');
  gr.addColorStop(.46,'#f2a565'); gr.addColorStop(1,'#f2a565');
  g.fillStyle=gr; g.fillRect(0,0,4,512);
  scene.background = new THREE.CanvasTexture(c);
})();
var camera = new THREE.PerspectiveCamera(62, 1, 0.5, 700);
scene.add(new THREE.HemisphereLight(0xffd9b0, 0x3a3046, 0.95));
var sunLight = new THREE.DirectionalLight(0xffc48a, 0.75); sunLight.position.set(-30,40,-80); scene.add(sunLight);
var sun = new THREE.Mesh(new THREE.CircleGeometry(26,32), new THREE.MeshBasicMaterial({color:0xffe2a8, fog:false}));
sun.position.set(-60, 26, -560); scene.add(sun);

/* ---------- road ---------- */
var LEN = 520, Z0 = 40, ROAD_HALF = 7, LANES = [-5.25,-1.75,1.75,5.25], PERIOD = 12;
var ground = new THREE.Mesh(new THREE.PlaneGeometry(900, LEN+200), new THREE.MeshLambertMaterial({color:0x4a4038}));
ground.rotation.x = -Math.PI/2; ground.position.set(0,-0.05, Z0-LEN/2); scene.add(ground);
var roadTex = (function(){
  var c = mkCanvas(512,512), g = c.getContext('2d'), i;
  g.fillStyle='#2a2932'; g.fillRect(0,0,512,512);
  for(i=0;i<2600;i++){ g.fillStyle = rand()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.08)'; g.fillRect(rand()*512,rand()*512,2,2); }
  var X = function(m){ return (m+8)/16*512; };
  g.fillStyle='#f0c24a'; g.fillRect(X(-7)-4,0,8,512); g.fillRect(X(7)-4,0,8,512);
  g.fillStyle='#ece6da'; [-3.5,0,3.5].forEach(function(m){ g.fillRect(X(m)-3,0,6,190); });
  var t = new THREE.CanvasTexture(c); t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, LEN/PERIOD);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
})();
var road = new THREE.Mesh(new THREE.PlaneGeometry(16, LEN), new THREE.MeshLambertMaterial({map:roadTex}));
road.rotation.x = -Math.PI/2; road.position.set(0,0,Z0-LEN/2); scene.add(road);
var kerbTex = (function(){
  var c = mkCanvas(8,64), g = c.getContext('2d');
  g.fillStyle='#e9e2d6'; g.fillRect(0,0,8,64); g.fillStyle='#c8402f'; g.fillRect(0,0,8,32);
  var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; return t;
})();
var kerbs = [-1,1].map(function(s){
  var t = kerbTex.clone(); t.needsUpdate = true; t.rotation = Math.PI/2; t.repeat.set(LEN/4,1);
  var m = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.45,LEN), new THREE.MeshLambertMaterial({map:t}));
  m.position.set(s*8.25,0.22,Z0-LEN/2); scene.add(m); return t;
});

/* ---------- roadside scenery (recycled) ---------- */
var scenery = [];
function addScenery(obj, z){ obj.position.z = z; scene.add(obj); scenery.push(obj); }
(function lamps(){
  var poleG = new THREE.CylinderGeometry(0.09,0.13,7.5,6), armG = new THREE.BoxGeometry(2.2,0.1,0.1), bulbG = new THREE.SphereGeometry(0.28,8,6);
  var poleM = new THREE.MeshLambertMaterial({color:0x4b4756}), bulbM = new THREE.MeshBasicMaterial({color:0xffc56b, fog:false});
  for (var i=0;i<LEN/40;i++) [-1,1].forEach(function(s){
    var g = new THREE.Group(), p = new THREE.Mesh(poleG,poleM), a = new THREE.Mesh(armG,poleM), b = new THREE.Mesh(bulbG,bulbM);
    p.position.y = 3.75; a.position.set(-s*1.0,7.4,0); b.position.set(-s*2.0,7.25,0);
    g.add(p,a,b); g.position.x = s*9.1; addScenery(g, Z0 - i*40 - (s>0?20:0));
  });
})();
(function trees(){
  var trunkG = new THREE.CylinderGeometry(0.16,0.22,2.2,5), leafG = new THREE.IcosahedronGeometry(1.5,0);
  var trunkM = new THREE.MeshLambertMaterial({color:0x4a3628}), leafM = [0x2f4a3a,0x3c5a3c,0x25403a].map(function(c){ return new THREE.MeshLambertMaterial({color:c, flatShading:true}); });
  for (var i=0;i<46;i++){
    var s = i%2?1:-1, g = new THREE.Group(), t = new THREE.Mesh(trunkG,trunkM), l = new THREE.Mesh(leafG, leafM[i%3]);
    t.position.y = 1.1; l.position.y = 3.1; var k = 0.8+rand()*0.7; l.scale.set(k,k*1.15,k);
    g.add(t,l); g.position.x = s*(11+rand()*4); addScenery(g, Z0 - rand()*LEN);
  }
})();
(function buildings(){
  var mats = ['#5c5472','#705a5c','#4b5b70','#7b6a59','#5a5168'].map(function(col){
    var c = mkCanvas(64,128), e = mkCanvas(64,128), g = c.getContext('2d'), h = e.getContext('2d');
    g.fillStyle = col; g.fillRect(0,0,64,128); h.fillStyle = '#000'; h.fillRect(0,0,64,128);
    for (var r=0;r<8;r++) for (var q=0;q<4;q++){
      var lit = rand()<.42, x = 5+q*15, y = 5+r*15;
      g.fillStyle = lit?'#ffd993':'rgba(20,18,34,.55)'; g.fillRect(x,y,9,9);
      if (lit){ h.fillStyle = '#c98a45'; h.fillRect(x,y,9,9); }
    }
    return new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(c), emissive:0xffffff, emissiveMap:new THREE.CanvasTexture(e)});
  });
  var box = new THREE.BoxGeometry(1,1,1);
  for (var i=0;i<64;i++){
    var s = i%2?1:-1, w = 9+rand()*9, d = 9+rand()*10, h = 9+rand()*rand()*52;
    var m = new THREE.Mesh(box, mats[(rand()*mats.length)|0]);
    m.scale.set(w,h,d); m.position.set(s*(20+w/2+rand()*38), h/2, 0); addScenery(m, Z0 - (i/64)*LEN - rand()*6);
  }
})();

/* ---------- cars ---------- */
var wheelG = new THREE.CylinderGeometry(0.34,0.34,0.26,12); wheelG.rotateZ(Math.PI/2);
var tyreM = new THREE.MeshLambertMaterial({color:0x15141a}), glassM = new THREE.MeshLambertMaterial({color:0x1d2233});
var headM = new THREE.MeshBasicMaterial({color:0xfff2c4}), tailM = new THREE.MeshBasicMaterial({color:0xb3261c});
var blinkM = new THREE.MeshBasicMaterial({color:0xffa51f}), shadowM = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.32, depthWrite:false});
var unit = new THREE.BoxGeometry(1,1,1), shadowG = new THREE.PlaneGeometry(1,1); shadowG.rotateX(-Math.PI/2);
function part(g, mat, sx,sy,sz, x,y,z){ var m = new THREE.Mesh(unit,mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z); g.add(m); return m; }
function makeCar(color, truck){
  var g = new THREE.Group(), body = new THREE.Group(), paint = new THREE.MeshLambertMaterial({color:color});
  var len = truck?7.4:4.2, wid = truck?2.2:1.8, hl = len/2, hw = wid/2, tail;
  if (truck){
    part(body, paint, 2.1,1.5,1.9, 0,1.25,-hl+0.95);
    part(body, glassM, 1.9,0.6,0.1, 0,1.55,-hl-0.02);
    part(body, new THREE.MeshLambertMaterial({color:0xd8d2c6}), 2.2,2.3,5.2, 0,1.75,hl-2.65);
    part(body, tyreM, 2.0,0.3,len-0.4, 0,0.5,0);
    tail = new THREE.MeshBasicMaterial({color:0xb3261c});
    part(body, tail, 0.35,0.2,0.08, -0.8,0.75,hl); part(body, tail, 0.35,0.2,0.08, 0.8,0.75,hl);
  } else {
    part(body, paint, 1.8,0.5,4.2, 0,0.58,0);
    part(body, paint, 1.74,0.14,3.9, 0,0.9,0.05);
    part(body, glassM, 1.5,0.48,2.0, 0,1.18,0.25);
    part(body, paint, 1.42,0.06,1.7, 0,1.44,0.3);
    part(body, headM, 0.4,0.14,0.08, -0.6,0.68,-hl); part(body, headM, 0.4,0.14,0.08, 0.6,0.68,-hl);
    tail = new THREE.MeshBasicMaterial({color:0xb3261c});
    part(body, tail, 0.5,0.14,0.08, -0.6,0.72,hl); part(body, tail, 0.5,0.14,0.08, 0.6,0.72,hl);
  }
  var bl = part(body, blinkM, 0.18,0.16,0.1, -hw+0.1,0.72,hl+0.02), br = part(body, blinkM, 0.18,0.16,0.1, hw-0.1,0.72,hl+0.02);
  bl.visible = br.visible = false;
  var wheels = [];
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){
    var w = new THREE.Mesh(wheelG, tyreM); w.position.set(p[0]*(hw-0.08), 0.34, p[1]*(hl-0.95)); g.add(w); wheels.push(w);
  });
  var sh = new THREE.Mesh(shadowG, shadowM); sh.scale.set(wid+0.5,1,len+0.5); sh.position.y = 0.02; g.add(sh);
  g.add(body); scene.add(g);
  return {mesh:g, body:body, wheels:wheels, tail:tail, bl:bl, br:br, len:len, wid:wid};
}
var player = makeCar(0xd9342b, false);
part(player.body, new THREE.MeshLambertMaterial({color:0xfff3e2}), 0.34,0.02,4.1, 0,0.985,0.05); // bonnet stripe
player.x = 0; player.z = 0; player.speed = 0; player.yaw = 0;

var COLORS = [0x3d6fb4,0xe9e3d8,0x2f8f7a,0xe0a12e,0x7d4fa0,0x9aa3ad,0x2b2e3a,0xc9603a,0x4f8fbf,0xd7d0c0,0x34a06a];
var traffic = [];
for (var ti=0; ti<14; ti++){
  var tc = makeCar(ti<11 ? COLORS[ti] : [0x3b5b8c,0xa8432f,0x3f7a58][ti-11], ti>=11);
  tc.active = false; tc.mesh.visible = false; traffic.push(tc);
}
function laneFree(lane, z, gap, self){
  for (var i=0;i<traffic.length;i++){ var o = traffic[i];
    if (o!==self && o.active && (o.lane===lane || o.pending===lane) && Math.abs(o.z - z) < gap) return false; }
  return true;
}
function spawn(c, zMin, zMax){
  for (var tries=0; tries<12; tries++){
    var lane = (rand()*4)|0, z = -(zMin + rand()*(zMax-zMin));
    if (laneFree(lane, z, 30, c)){
      c.lane = lane; c.pending = null; c.x = LANES[lane]; c.z = z; c.passed = false; c.blinkT = 0; c.timer = 4+rand()*9;
      c.base = (c.len>5 ? 32+rand()*22 : 38+rand()*46)/3.6; c.speed = c.base;
      c.active = true; c.mesh.visible = true; c.bl.visible = c.br.visible = false; return;
    }
  }
  c.active = false; c.mesh.visible = false; c.respawn = 1.5;
}

/* ---------- state ---------- */
var state = 'menu', dist = 0, bonus = 0, best = +(store.get('duskHighwayBest')||0), shake = 0, time = 0;
var input = {gas:false, brake:false, wheel:0, keyL:false, keyR:false, steer:0};
var tilt = {seen:false, raw:0, zero:0}, mode = 'touch';
var MAXV = 170/3.6;

function reset(){
  dist = 0; bonus = 0; shake = 0;
  player.x = LANES[1]; player.speed = 0; player.yaw = 0; input.steer = 0;
  traffic.forEach(function(c){ c.active = false; c.mesh.visible = false; c.respawn = 0; });
  for (var i=0;i<6;i++) spawn(traffic[i<5?i:11], 50, 420);
}
function activeTarget(){ return Math.min(traffic.length, 6 + Math.floor(dist/500)); }

/* ---------- input ---------- */
function hold(el, key){
  var set = function(v){ return function(e){ e.preventDefault(); input[key] = v; el.classList.toggle('down', v);
    if (v && el.setPointerCapture) { try{ el.setPointerCapture(e.pointerId); }catch(_){} } }; };
  el.addEventListener('pointerdown', set(true)); el.addEventListener('pointerup', set(false));
  el.addEventListener('pointercancel', set(false)); el.addEventListener('lostpointercapture', set(false));
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
hold($('gas'),'gas'); hold($('brake'),'brake');
(function wheelDrag(){
  var el = $('wheel'), sx = null;
  el.addEventListener('pointerdown', function(e){ e.preventDefault(); sx = e.clientX; try{ el.setPointerCapture(e.pointerId); }catch(_){}
    if (mode==='tilt') setMode('touch'); });
  el.addEventListener('pointermove', function(e){ if (sx!==null) input.wheel = clamp((e.clientX - sx)/64, -1, 1); });
  var end = function(){ sx = null; input.wheel = 0; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
})();
addEventListener('keydown', function(e){ key(e,true); }); addEventListener('keyup', function(e){ key(e,false); });
function key(e, v){
  var k = e.key;
  if (k==='ArrowLeft'||k==='a'||k==='A') input.keyL = v;
  else if (k==='ArrowRight'||k==='d'||k==='D') input.keyR = v;
  else if (k==='ArrowUp'||k==='w'||k==='W') input.gas = v;
  else if (k==='ArrowDown'||k==='s'||k==='S'||k===' ') input.brake = v;
  else if (v && (k==='p'||k==='P'||k==='Escape')) { togglePause(); return; }
  else if (v && k==='Enter' && state!=='play') { $('go') && $('go').click(); return; }
  else return;
  if (state==='play') e.preventDefault();
}
function screenAngle(){ var a = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : (window.orientation||0); return ((a%360)+360)%360; }
function onTilt(e){
  if (e.gamma===null || e.gamma===undefined) return;
  var a = screenAngle(), r = a===90 ? e.beta : a===270 ? -e.beta : a===180 ? -e.gamma : e.gamma;
  tilt.raw = r;
  if (!tilt.seen){ tilt.seen = true; tilt.zero = r; setMode('tilt'); }
}
function startTilt(){
  var D = window.DeviceOrientationEvent; if (!D) return;
  var listen = function(){ addEventListener('deviceorientation', onTilt); };
  if (typeof D.requestPermission === 'function') { D.requestPermission().then(function(s){ if (s==='granted') listen(); }).catch(function(){}); }
  else listen();
}
addEventListener('orientationchange', function(){ setTimeout(function(){ tilt.zero = tilt.raw; }, 400); });
function setMode(m){
  mode = (m==='tilt' && tilt.seen) ? 'tilt' : 'touch';
  if (mode==='tilt') tilt.zero = tilt.raw;
  var b = $('modeBtn'); b.textContent = mode==='tilt' ? 'Tilt' : 'Touch'; b.setAttribute('aria-pressed', mode==='tilt');
}
$('modeBtn').addEventListener('click', function(){
  if (mode==='tilt') { setMode('touch'); toast('Touch steering'); }
  else if (tilt.seen) { setMode('tilt'); toast('Tilt steering centred'); }
  else toast('No tilt sensor here');
});

/* ---------- audio ---------- */
var audio = null, soundOn = store.get('duskHighwaySound') !== '0';
$('soundBtn').setAttribute('aria-pressed', soundOn);
function initAudio(){
  if (audio) { audio.ctx.resume && audio.ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    var ctx = new AC(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(ctx.destination); o1.start(); o2.start();
    audio = {ctx:ctx, o1:o1, o2:o2, f:f, g:g};
  } catch(e){ audio = null; }
}
function crashSound(){
  if (!audio || !soundOn) return;
  var ctx = audio.ctx, n = ctx.sampleRate*0.5, buf = ctx.createBuffer(1,n,ctx.sampleRate), d = buf.getChannelData(0);
  for (var i=0;i<n;i++) d[i] = (rand()*2-1)*Math.pow(1-i/n,2.2);
  var s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 0.5; s.buffer = buf; s.connect(g); g.connect(ctx.destination); s.start();
}
$('soundBtn').addEventListener('click', function(){ soundOn = !soundOn; this.setAttribute('aria-pressed', soundOn); store.set('duskHighwaySound', soundOn?'1':'0'); });

/* ---------- UI ---------- */
var toastT = 0;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); toastT = 1.3; }
function showCard(html){ card.innerHTML = html; overlay.hidden = false; var b = $('go'); if (b) b.addEventListener('click', go); }
function menuCard(){
  showCard('<h1>Dusk Highway</h1>'
   + '<p>Thread through evening traffic for as long as you can. One crash ends the run.</p>'
   + '<ul class="how"><li><b>Steer</b><span>Tilt your phone like a steering wheel, or drag the wheel on screen.</span></li>'
   + '<li><b>Pedals</b><span>Hold Gas to speed up, Brake to slow down.</span></li>'
   + '<li><b>Score</b><span>1 point a metre, plus 50 for every close pass.</span></li></ul>'
   + '<button class="btn" id="go" type="button">Start driving</button>'
   + '<p class="note">Keyboard: arrow keys or WASD. Hold the phone how you like, then press Start to centre the tilt.</p>');
}
function go(){
  initAudio();
  if (state==='pause') { state = 'play'; if (mode==='tilt') tilt.zero = tilt.raw; overlay.hidden = true; return; }
  if (!tilt.started) { tilt.started = true; startTilt(); } else if (mode==='tilt') tilt.zero = tilt.raw;
  reset(); state = 'play'; overlay.hidden = true; $('hud').hidden = false; $('controls').hidden = false;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function(){}); } catch(e){}
}
function togglePause(){
  if (state==='play'){ state = 'pause'; input.gas = input.brake = false;
    showCard('<h1>Paused</h1><div class="stats"><div><span>Score</span><b>'+score()+'</b></div><div><span>Distance</span><b>'+(dist/1000).toFixed(2)+' km</b></div></div><button class="btn" id="go" type="button">Resume</button>'); }
  else if (state==='pause') go();
}
$('pauseBtn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', function(){ if (document.hidden && state==='play') togglePause(); });
function score(){ return Math.floor(dist) + bonus; }
function crash(){
  state = 'over'; shake = 0.6; crashSound();
  try { navigator.vibrate && navigator.vibrate(180); } catch(e){}
  var s = score(), isBest = s > best; if (isBest){ best = s; store.set('duskHighwayBest', String(best)); }
  setTimeout(function(){ if (state!=='over') return;
    showCard('<h1>'+(isBest?'New best run':'Crashed')+'</h1>'
     + '<div class="stats"><div><span>Score</span><b>'+s+'</b></div><div><span>Distance</span><b>'+(dist/1000).toFixed(2)+' km</b></div><div><span>Best</span><b>'+best+'</b></div></div>'
     + '<button class="btn" id="go" type="button">Drive again</button>');
  }, 900);
}

/* ---------- simulation ---------- */
function update(dt){
  time += dt;
  var playing = state==='play';
  // steering input
  var target = 0;
  if (playing){
    if (mode==='tilt'){ target = clamp((tilt.raw - tilt.zero)/26, -1, 1); if (Math.abs(target) < 0.05) target = 0; }
    else target = input.wheel;
    if (input.keyL) target -= 1; if (input.keyR) target += 1; target = clamp(target,-1,1);
  }
  input.steer += (target - input.steer)*Math.min(1, dt*(mode==='tilt'?12:7));
  // speed
  if (playing){
    var a = input.brake ? -24 : input.gas ? 10.5*(1 - player.speed/MAXV) + 0.4 : -1.6;
    player.speed = clamp(player.speed + a*dt, 0, MAXV);
  } else if (state==='menu') player.speed += (19 - player.speed)*Math.min(1,dt);
  else if (state==='over') player.speed = Math.max(0, player.speed - 45*dt);
  var v = player.speed, move = (state==='pause') ? 0 : v*dt;
  // heading & lateral motion
  if (playing){
    var maxYaw = 0.34/(1 + v/42);
    player.yaw += (input.steer*maxYaw - player.yaw)*Math.min(1, dt*6);
    player.x += Math.sin(player.yaw)*v*dt*1.15;
    var lim = ROAD_HALF - 0.85;
    if (Math.abs(player.x) > lim){ player.x = clamp(player.x,-lim,lim); player.speed *= Math.max(0, 1 - 1.4*dt); player.yaw *= 0.6;
      if (v > 8) shake = Math.max(shake, 0.12); }
    dist += move;
  }
  // world scroll
  roadTex.offset.y = (roadTex.offset.y + move/PERIOD) % 1;
  kerbs.forEach(function(t){ t.offset.x = (t.offset.x - move/4) % 1; });
  for (var i=0;i<scenery.length;i++){ var s = scenery[i]; s.position.z += move; if (s.position.z > Z0) s.position.z -= LEN; }
  // traffic
  if (state!=='pause' && state!=='menu'){
    var want = activeTarget(), count = 0;
    traffic.forEach(function(c){ if (c.active) count++; });
    for (i=0;i<traffic.length;i++){
      var c = traffic[i];
      if (!c.active){ if (playing && count < want){ c.respawn = (c.respawn||0) - dt; if (c.respawn <= 0){ spawn(c, 230, 400); if (c.active) count++; } } continue; }
      var vt = c.base;
      for (var j=-1;j<traffic.length;j++){
        var o = j<0 ? player : traffic[j]; if (o===c || (j>=0 && !o.active)) continue;
        var ox = j<0 ? player.x : o.x, oz = j<0 ? 0 : o.z, gap = c.z - oz - (c.len+o.len)/2;
        if (gap > -1 && gap < 11 && Math.abs(ox - c.x) < (c.wid+o.wid)/2 + 0.35) vt = Math.min(vt, o.speed*0.92);
      }
      c.speed += (vt - c.speed)*Math.min(1, dt*2.5);
      c.z += (v - c.speed)*dt;
      // lane changes, signalled first
      if (playing){
        c.timer -= dt;
        if (c.timer < 0 && c.pending===null){
          c.timer = 7 + rand()*10;
          var nl = c.lane + (rand()<.5?-1:1);
          if (nl>=0 && nl<4 && c.z < -28 && c.z > -170 && laneFree(nl, c.z, 16, c)){ c.pending = nl; c.blinkT = 1.3; c.dir = nl>c.lane?1:-1; }
        }
      }
      if (c.pending!==null){
        c.blinkT -= dt; var on = (time*3.2 % 1) < 0.5;
        c.bl.visible = on && c.dir<0; c.br.visible = on && c.dir>0;
        if (c.blinkT <= 0){ c.lane = c.pending; if (Math.abs(c.x - LANES[c.lane]) < 0.08){ c.pending = null; c.bl.visible = c.br.visible = false; } }
      }
      var dx = LANES[c.lane] - c.x, stepX = clamp(dx, -1.7*dt, 1.7*dt); c.x += stepX;
      c.mesh.position.set(c.x, 0, c.z); c.mesh.rotation.y = -stepX/Math.max(dt,1e-3)*0.05;
      var spin = c.speed*dt/0.34; c.wheels.forEach(function(w){ w.rotation.x -= spin; });
      if (playing){
        var ax = Math.abs(c.x - player.x), az = Math.abs(c.z), hx = (c.wid + player.wid)/2, hz = (c.len + player.len)/2;
        if (ax < hx - 0.14 && az < hz - 0.2){ crash(); playing = false; }
        else if (!c.passed && c.z > hz){ c.passed = true;
          if (ax - hx < 0.75 && v - c.speed > 6){ bonus += 50; toast('Close pass +50'); } }
      }
      if (c.z > 34 || c.z < -560){ c.active = false; c.mesh.visible = false; c.respawn = 0.3 + rand()*1.2; count--; }
    }
  }
  // player visuals
  var pm = player.mesh;
  pm.position.set(player.x, 0, 0); pm.rotation.y = -player.yaw;
  player.body.rotation.z = input.steer*Math.min(1, v/25)*0.05;
  player.body.rotation.x = playing ? (input.brake && v>2 ? 0.03 : input.gas ? -0.012 : 0) : 0;
  var ps = v*dt/0.34; player.wheels.forEach(function(w,k){ w.rotation.x -= (state==='pause'?0:ps); if (k<2) w.rotation.y = -input.steer*0.4; });
  player.tail.color.setHex(playing && input.brake ? 0xff5a40 : 0xb3261c);
  // camera
  var portrait = camera.aspect < 1, sh = shake > 0 ? shake : 0; if (shake > 0) shake -= dt;
  camera.fov = (portrait ? 80 : 60) + v*0.2; camera.updateProjectionMatrix();
  var cx = player.x*0.82 + (rand()-.5)*sh*1.4;
  camera.position.set(cx, (portrait?3.9:3.1) + (rand()-.5)*sh, portrait?9.2:7.6);
  camera.lookAt(player.x*0.9 + player.yaw*6, 1.1, -10);
  camera.rotation.z += -input.steer*Math.min(1,v/30)*0.035;
  // hud
  $('spd').textContent = Math.round(v*3.6);
  var km = (dist/1000).toFixed(2); $('odo').textContent = ('000'+km).slice(-6);
  $('score').textContent = score();
  var w = $('wheel'); w.style.transform = 'rotate(' + (input.steer*95).toFixed(1) + 'deg)'; w.setAttribute('aria-valuenow', input.steer.toFixed(2));
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (audio){
    var on = soundOn && state==='play', t = audio.ctx.currentTime, f = 48 + v*3.6;
    audio.o1.frequency.setTargetAtTime(f, t, 0.05); audio.o2.frequency.setTargetAtTime(f/2, t, 0.05);
    audio.f.frequency.setTargetAtTime(380 + v*22, t, 0.08);
    audio.g.gain.setTargetAtTime(on ? 0.035 + (input.gas?0.03:0) : 0, t, 0.08);
  }
}
function resize(){
  var w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
menuCard();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
